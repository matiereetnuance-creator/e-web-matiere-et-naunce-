; Augmente les limites d'envoi pour les photos de réalisations (valeur par
; défaut de PHP : 2 Mo, trop restrictive pour des photos de smartphone).
; Fichier .user.ini : fonctionne quel que soit le mode d'exécution de PHP
; sur o2switch (contrairement à php_value dans .htaccess, qui peut
; provoquer une erreur 500 selon la configuration). Peut prendre jusqu'à
; quelques minutes pour être pris en compte (mise en cache de PHP-FPM).
upload_max_filesize = 15M
post_max_size = 16M
